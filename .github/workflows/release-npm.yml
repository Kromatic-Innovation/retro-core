name: Release (npm)

# HUMAN-GATED, ALWAYS. `workflow_dispatch` is the only trigger, deliberately:
# publishing is irreversible in practice — an npm version cannot be cleanly
# unpublished after 72 hours, and the version number can never be reused. Do NOT
# add `push`, `release`, `schedule`, or any other trigger to this workflow. See
# retro-core#2.
#
# Prerequisite before a real (non-dry-run) publish can succeed: an npm automation
# token with publish rights on the `retro-core` package, stored as the repository
# secret `NPM_TOKEN`. Until that secret exists the guard step below fails fast
# with an explicit message rather than half-publishing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Rehearse the publish without sending anything to the registry. Defaults
          to true so a mis-dispatch cannot publish; set to false for a real,
          irreversible release.
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Run test suite
        run: npm test

      - name: Verify publish credentials are provisioned
        if: ${{ inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Repository secret NPM_TOKEN is not set. Provision an npm automation token with publish rights on 'retro-core' before dispatching a real release."
            exit 1
          fi
          echo "ok: NPM_TOKEN is present."

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run: no package will be sent to the registry."
            npm publish --dry-run --access public
          else
            npm publish --access public
          fi

      - name: Write release summary
        if: always()
        run: |
          {
            echo "## npm release"
            echo "- package: \`$(node -p "require('./package.json').name")\`"
            echo "- version: \`$(node -p "require('./package.json').version")\`"
            echo "- dry_run: \`${DRY_RUN}\`"
            echo "- dispatched_by: \`${GITHUB_ACTOR}\`"
            echo "- ref: \`${GITHUB_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
